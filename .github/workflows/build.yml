name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: unzip -o "$(ls *.zip | head -1)"

      - name: Build APK
        working-directory: MandirPolayon
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mandir-polayon-apk
          path: MandirPolayon/app/build/outputs/apk/debug/app-debug.apk
